<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
    <style>
        .container { 
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .icon-set {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
        }
        .download-all {
            margin: 20px 0;
            padding: 10px 20px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        canvas {
            border: 1px solid #eee;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Icon Generator for Extension</h2>
        <button class="download-all" onclick="downloadAll()">Download All Icons</button>
        <div class="icon-grid">
            <div class="icon-set">
                <h3>Enabled Icons</h3>
                <div id="enabledIcons"></div>
            </div>
            <div class="icon-set">
                <h3>Disabled Icons</h3>
                <div id="disabledIcons"></div>
            </div>
        </div>
    </div>

    <script>
        const sizes = [16, 48, 128];
        const svgContent = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="20" fill="#4285f4"/>
                <path d="M24 12v12l8 8" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
                <circle cx="24" cy="24" r="3" fill="white"/>
            </svg>
        `;

        function createCanvas(size, disabled = false) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0, size, size);
                
                if (disabled) {
                    // Convert to grayscale
                    const imageData = ctx.getImageData(0, 0, size, size);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                        data[i] = avg;     // R
                        data[i + 1] = avg; // G
                        data[i + 2] = avg; // B
                    }
                    ctx.putImageData(imageData, 0, 0);
                }
            };
            
            img.src = 'data:image/svg+xml;base64,' + btoa(svgContent);
            return canvas;
        }

        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAll() {
            sizes.forEach(size => {
                const enabledCanvas = createCanvas(size);
                const disabledCanvas = createCanvas(size, true);
                
                // Wait for images to load before downloading
                setTimeout(() => {
                    downloadCanvas(enabledCanvas, `icon${size}.png`);
                    downloadCanvas(disabledCanvas, `icon${size}_disabled.png`);
                }, 100);
            });
        }

        // Create and display all icons
        sizes.forEach(size => {
            const enabledCanvas = createCanvas(size);
            const disabledCanvas = createCanvas(size, true);
            
            document.getElementById('enabledIcons').appendChild(enabledCanvas);
            document.getElementById('disabledIcons').appendChild(disabledCanvas);
        });
    </script>
</body>
</html>
